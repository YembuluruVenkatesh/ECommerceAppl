server:
  port: 8081

spring:
  application:
    name: customer-service   # 👈 Must match config file in Config Server
  config:
    import: optional:configserver:http://localhost:8888  # Fetch configs from Config Server

# ✅ Actuator + Tracing Config
management:
  endpoints:
    web:
      exposure:
        include: "*"   # Expose all actuator endpoints
  tracing:
    sampling:
      probability: 1.0   # Capture 100% of traces
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces  # 👈 Tempo HTTP endpoint inside Docker

# ✅ Logging pattern with trace/span IDs
logging:
  pattern:
    level: "[${spring.application.name}] [%X{traceId:-}] [%X{spanId:-}] %5p %c{1.} - %m%n"

# ✅ Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    ip-address: 127.0.0.1
    prefer-ip-address: true
    instance-id: customer-service:${server.port}
    metadata-map:
      hostname: localhost

# ✅ Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      customerServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

      orderServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      customerServiceRetry:
        maxAttempts: 3
        waitDuration: 1s

      orderServiceRetry:
        maxAttempts: 3
        waitDuration: 2s
