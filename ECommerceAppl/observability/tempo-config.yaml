server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compacted_block_retention: 24h

metrics_generator:
  processor:
    span_metrics:
    service_graphs:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/metrics
    remote_write:
      - url: http://loki:3100/loki/api/v1/push

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
