server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          # filters:
          #   - StripPrefix=1

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          # filters:
          #   - StripPrefix=1

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          # filters:
          #   - StripPrefix=1

        - id: config-server
          uri: lb://config-server
          predicates:
            - Path=/api/config/**
          # filters:
          #   - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: api-gateway:${server.port}

jwt:
  secret: mysecretkeyformicroservices1234567890
  expiration: 3600000  # 1 hour
