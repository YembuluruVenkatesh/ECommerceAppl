# ===========================
# 🧩 order-service.yml
# Configuration for Order Service (loaded by Config Server)
# ===========================

server:
  port: 8082   # Port for Order Service

spring:
  application:
    name: order-service    # Must match file name (order-service.yml)

  # Fetch config from Config Server
  config:
    import: "optional:configserver:http://config-server:8888"

  # ✅ Database connection (inside Docker)
  datasource:
    url: jdbc:mysql://mysql-db:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ✅ Expose actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"

# ✅ Eureka Discovery Client
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: order-service:${server.port}

# ✅ Resilience4j (Circuit Breaker + Retry)
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    instances:
      orderServiceRetry:
        maxAttempts: 3
        waitDuration: 1s

# ✅ Custom example settings (optional)
order:
  default-status: "PENDING"
  max-items-per-order: 10
