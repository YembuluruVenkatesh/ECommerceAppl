server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/YembuluruVenkatesh/ConfigServer.git
          clone-on-start: true
          default-label: main  # branch name

        # For local testing with a local Git folder, uncomment and adjust the path:
        # uri: file:///D:/SpringBoot/ecom-config-repo
        # default-label: main

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost       # force localhost
    ip-address: 127.0.0.1     # force IP to localhost
    prefer-ip-address: true    # register with IP
    instance-id: config-server:${server.port}
    metadata-map:
      hostname: localhost
